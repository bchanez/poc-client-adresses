spring:
  jpa:
    hibernate:
      ddl-auto: update
    # open-in-view: false => la session est fermée à la sortie du repo. C'est le
    # réglage sain (et le défaut recommandé). Il rend VISIBLE le piège du lazy
    # loading : accéder aux adresses hors transaction lève une exception. Nos tests
    # s'appuient dessus pour prouver qu'on charge les adresses AU BON MOMENT.
    open-in-view: false
    properties:
      hibernate.format_sql: true
      # Compte les requêtes SQL réellement émises : notre test N+1 s'en sert.
      hibernate.generate_statistics: true

logging:
  level:
    com.exemple.client: INFO
