# Schéma généré par Hibernate (POC). En prod : Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update

# open-in-view=false : la session est fermée à la sortie de la couche transactionnelle.
# C'est le réglage sain (et le défaut recommandé). Il rend VISIBLE le piège du lazy loading :
# accéder aux adresses hors transaction lève une exception. Nos tests s'appuient dessus.
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
# Compte les requêtes SQL réellement émises : nos tests de perf (1 requête, N inserts) s'en servent.
spring.jpa.properties.hibernate.generate_statistics=true

logging.level.com.exemple.client=INFO
